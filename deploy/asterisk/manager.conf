;
; Lab AMI user for `docker compose --profile lab up`.
; Published only on 127.0.0.1:5038. Change the secret before you point it at anything real.
; The stock image must allow this file to replace manager.conf. If the image
; ignores the mount, copy the [span] user into the image's own manager.conf.
;
[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
displayconnects = no

[span]
secret = span-lab-ami
deny = 0.0.0.0/0.0.0.0
permit = 10.0.0.0/255.0.0.0
permit = 172.16.0.0/255.240.0.0
permit = 192.168.0.0/255.255.0.0
read = system,call,log,verbose,agent,user,reporting,cdr,dialplan
write = call
; write = call is Hangup. It is not originate and it is not command.
